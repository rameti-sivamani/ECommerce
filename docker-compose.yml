# Runs the whole shop: MySQL, the Spring Boot API and the React app.
# Start with: docker compose up --build   then open http://localhost:3000
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: e_commerce
      MYSQL_USER: zipbuy
      MYSQL_PASSWORD: zipbuy
      MYSQL_ROOT_PASSWORD: zipbuy-root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uzipbuy", "-pzipbuy"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/e_commerce
      DB_USERNAME: zipbuy
      DB_PASSWORD: zipbuy
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
