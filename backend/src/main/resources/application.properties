spring.application.name=backend-spring

# Database (MySQL). Defaults match docker-compose.yml; override with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e_commerce}
spring.datasource.username=${DB_USERNAME:zipbuy}
spring.datasource.password=${DB_PASSWORD:zipbuy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origin of the React app, allowed by CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

# Insert demo categories and products when the catalogue is empty
app.seed-demo-data=${SEED_DEMO_DATA:true}
